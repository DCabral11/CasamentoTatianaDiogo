name: Verify deployment
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/rsvp-presence.Tests.cjs tests/localization.Tests.cjs
      - run: npm ci --prefix tests/vercel --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix tests/vercel
      - run: dotnet test tests/CasamentoTatianaDiogo.Tests/CasamentoTatianaDiogo.Tests.csproj --configuration Release
      - run: docker build --tag casamento-vercel .
